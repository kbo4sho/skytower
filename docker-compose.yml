version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: skytower-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  skytower:
    build: .
    container_name: skytower
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json
    environment:
      - OLLAMA_URL=http://ollama:11434
      - PORT=3000
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host  # Required for Sonos discovery (mDNS/SSDP)

volumes:
  ollama_data:
